# Render Blueprint — one web service with a persistent disk for all Lantern data.
# Render → New → Blueprint → pick this repo. You'll be asked for ADMIN_PASSWORD.
services:
  - type: web
    name: lantern
    runtime: node
    plan: starter            # a paid instance is required for a persistent disk
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # prompted on creation; never committed to git
      - key: PUBLIC_URL      # e.g. https://lantern.onrender.com (needed for Stripe/Google redirects)
        sync: false
      - key: PACKAGE_SIGNING_KEY   # npm run gen:signing-key — keep stable
        sync: false
      # Optional: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, GAMES_ORIGIN — see DEPLOY.md
    disk:
      name: lantern-data
      mountPath: /var/data
      sizeGB: 1
